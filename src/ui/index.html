<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0c0d">
<title>Atril</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><span class="dot"></span>atril<span class="ext">.syn</span></div>

    <div class="label">spaces <span id="machine" class="muted"></span></div>
    <ul id="spaces"></ul>

    <div class="row">
      <button id="new" class="link" title="Nuevo space: una carpeta de trabajo">new</button>
      <button id="find" class="link" title="Buscar cualquier sesión (Ctrl+Shift+K)">find</button>
    </div>

    <div class="label">agents <span id="count" class="muted"></span></div>
    <ul id="agents"></ul>

    <button id="collapse" class="link small" title="Ocultar panel (Ctrl+Shift+B)">«</button>
  </aside>

  <main id="main">
    <nav id="tabs"><button id="expand" title="Mostrar panel (Ctrl+Shift+B)" hidden>»</button><div id="tablist"></div><input id="newtitle" placeholder="título (opcional) · Enter" maxlength="80" hidden autocomplete="off" spellcheck="false"><button id="plus" title="Nueva terminal (Ctrl+Shift+T)">+</button><button id="menu" class="only-narrow" title="Sesiones">☰</button></nav>
    <section id="stage">
      <div id="empty">
        <p id="empty-title">Este space no tiene terminales.</p>
        <p class="muted">Abrí una con <kbd>+</kbd>. Cerrar una pestaña no mata el programa: sigue corriendo<br>y la encontrás en <b>agents</b> o con <b>find</b>.</p>
      </div>
    </section>
    <div id="keys" class="only-touch">
      <button data-k="esc">Esc</button><button data-k="tab">Tab</button><button data-k="ctrl" class="mod">Ctrl</button>
      <button data-k="up">↑</button><button data-k="down">↓</button><button data-k="left">←</button><button data-k="right">→</button>
      <button data-k="ctrlc">^C</button>
    </div>
  </main>
</div>

<div id="palette" hidden>
  <div class="box">
    <input id="q" placeholder="nombre, comando, pid o id…" autocomplete="off" spellcheck="false">
    <ul id="results"></ul>
  </div>
</div>

<div id="picker" hidden>
  <div class="box wide">
    <div class="ph">Nuevo space <span class="muted">· la carpeta de un proyecto</span></div>
    <input id="pq" placeholder="filtrá, o pegá una ruta y Enter…" autocomplete="off" spellcheck="false">
    <div id="pcrumb"></div>
    <ul id="plist"></ul>
    <div class="pfoot"><span id="pmsg" class="muted"></span><button id="pcancel">Cancelar</button><button id="pok" class="primary">Abrir acá</button></div>
  </div>
</div>

<div id="ctx" hidden>
  <button data-a="open">Abrir</button>
  <button data-a="rename">Ponerle título…</button>
  <button data-a="kill" class="danger">Matar proceso</button>
  <button data-a="restart">Reiniciar</button>
  <button data-a="remove">Quitar de la lista</button>
  <button data-a="newtab" data-for="space">Nueva terminal acá</button>
  <button data-a="forget" data-for="space">Olvidar este space</button>
</div>

<script src="vendor/xterm.min.js"></script>
<script src="vendor/addon-fit.min.js"></script>
<script src="app.js"></script>
</body>
</html>
